        <path data-hf-id="hf-m2oc" d="M245 62 V230 Q245 308 325 308 H400 M432 62 V340 Q432 430 345 432" fill="none" stroke="#7c3aed" stroke-width="78" />

  <script>
    const D = 12;
    const tl = gsap.timeline({ paused: true });

    // Seek-safe text: a pure function of tween progress.
    function type(el, str, at, dur) {
      const p = { n: 0 };
      tl.fromTo(p, { n: 0 }, { n: str.length, duration: dur, ease: "none", onUpdate: () => (el.textContent = str.slice(0, Math.round(p.n))) }, at);
    }
    function clock(el, from, to, at, dur) {
      const p = { s: from };
      const fmt = (s) => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
      tl.fromTo(p, { s: from }, { s: to, duration: dur, ease: "none", onUpdate: () => (el.textContent = fmt(p.s)) }, at);
    }
    const typed = document.getElementById("loop-typed");
    const tnow = document.getElementById("loop-tnow");

    // ---------- the mark's underscore blinks, phase locked, as in the terminal loop ----------
    for (let t = 0; t < D; t += 1) {
      tl.set("#loop-under", { opacity: 1 }, t).set("#loop-under", { opacity: 0 }, t + 0.5);
    }

    // ---------- open: the mark gives way to the window (0.7 → 1.7) ----------
    tl.fromTo("#loop-logo svg", { scale: 1, opacity: 1 }, { scale: 0.55, opacity: 0, duration: 0.5, ease: "power2.in" }, 0.7);
    tl.fromTo(
      "#loop-win",
      { opacity: 0, scale: 0.9, clipPath: "inset(42% 44% 42% 44% round 16px)" },
      { opacity: 1, scale: 1, clipPath: "inset(0% 0% 0% 0% round 16px)", duration: 0.75, ease: "expo.out" },
      0.95,
    );

    // ---------- screens that arrive by navigation cross over briefly ----------
    for (const [id, at] of [["#s2", 3.35], ["#s4", 6.3]]) {
      tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "power2.out" }, at);
    }

    // ---------- the cursor ----------
    const cur = "#loop-cursor";
    const click = (at) => tl.fromTo(cur, { scale: 1 }, { scale: 0.86, duration: 0.07, ease: "power2.in", yoyo: true, repeat: 1, transformOrigin: "3px 2px" }, at);
    tl.fromTo(cur, { x: 1180, y: 640, opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 1.55);
    tl.to(cur, { x: 900, y: 18, duration: 0.6, ease: "power2.inOut" }, 1.75); // to the search box
    click(2.35);
    tl.to(cur, { x: 560, y: 596, duration: 0.7, ease: "power2.inOut" }, 3.55); // to the song
    click(4.6);
    click(4.74);
    tl.to(cur, { x: 952, y: 596, duration: 0.55, ease: "power2.inOut" }, 5.45); // to its album
    click(6.18);
    tl.to(cur, { x: 1370, y: 410, duration: 0.7, ease: "power2.inOut" }, 6.9); // to a heart
    click(7.93);
    tl.to(cur, { opacity: 0, duration: 0.2, ease: "power2.in" }, 10.15);

    // ---------- the search: focus, then the query typed ----------
    tl.set("#loop-caret", { opacity: 0 }, 0).set("#loop-caret", { opacity: 1 }, 2.35).set("#loop-caret", { opacity: 0 }, 3.35);
    tl.set(typed, { textContent: "" }, 0);
    type(typed, "daft punk", 2.45, 0.7);

    // ---------- the heart pops as it fills ----------
    tl.set("#loop-heart", { opacity: 0 }, 0);
    tl.fromTo("#loop-heart", { opacity: 1, scale: 1.35 }, { scale: 1, duration: 0.32, ease: "back.out(2)" }, 8.05);
    tl.set("#loop-heart", { opacity: 0 }, 8.5);

    // ---------- playback: One More Time runs on, then the new song from 0:00 ----------
    const OMT = 321, HBFS = 227, SWITCH = 4.8;
    tl.set("#loop-fill-a", { opacity: 1 }, 0).set("#loop-fill-a", { opacity: 0 }, SWITCH);
    tl.set("#loop-fill-b", { opacity: 0 }, 0).set("#loop-fill-b", { opacity: 1 }, SWITCH);
    tl.fromTo("#loop-fill-a", { scaleX: 139 / OMT }, { scaleX: (139 + SWITCH) / OMT, duration: SWITCH, ease: "none" }, 0);
    clock(tnow, 139, 139 + SWITCH, 0, SWITCH);
    tl.fromTo("#loop-fill-b", { scaleX: 0 }, { scaleX: (D - SWITCH) / HBFS, duration: D - SWITCH, ease: "none" }, SWITCH);
    clock(tnow, 0, D - SWITCH, SWITCH, D - SWITCH);

    // ---------- close: the window folds back into the mark (10.6 → 11.45) ----------
    tl.to("#loop-win", { opacity: 0, scale: 0.9, clipPath: "inset(42% 44% 42% 44% round 16px)", duration: 0.5, ease: "expo.in" }, 10.6);
    tl.to("#loop-logo svg", { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 10.95);

    window.__timelines["loop"] = tl;
  </script>

name: release

# Build static binaries for 4 OS/arch combos and attach them to a
# GitHub Release whenever you push a tag like `v0.2.0`.
# Also publishes the updated PKGBUILD to the Arch User Repository (AUR).
#
# Asset naming follows the convention expected by install.sh:
#   ytmgo_Linux_x86_64.tar.gz
#   ytmgo_Linux_arm64.tar.gz
#   ytmgo_Darwin_x86_64.tar.gz
#   ytmgo_Darwin_arm64.tar.gz
# Each tarball contains a single `ytmgo` binary + a `ytmgo_<asset>.sha256`
# sidecar so install.sh can verify the download.

on:
  push:
    tags:
      - "v*"

# Least privilege per job rather than one blanket grant: only the
# release job writes anything, and the AUR job — the one that talks to a
# host outside GitHub — needs no repo access at all.
permissions:
  contents: read

# Don't pile up concurrent release jobs for the same tag
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x86_64
            goarch: amd64
            asset_os: Linux   # capitalized to match install.sh's `uname -s`
          - os: linux
            arch: arm64
            goarch: arm64
            asset_os: Linux
          - os: darwin
            arch: x86_64
            goarch: amd64
            asset_os: Darwin
          - os: darwin
            arch: arm64
            goarch: arm64
            asset_os: Darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.22"
          cache: true

      - name: Build static binary
        env:
          # Version metadata — baked into the binary at link time.
          # github.ref_name is the tag name (e.g. "v0.1.1") on tag pushes.
          VERSION:    ${{ github.ref_name }}
          COMMIT:     ${{ github.sha }}
          BUILD_DATE: ${{ github.event.repository.updated_at }}
          GOOS:       ${{ matrix.os == 'darwin' && 'darwin' || 'linux' }}
          GOARCH:     ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          go build \
            -trimpath \
            -ldflags="-s -w \
              -X 'ytmgo/internal/version.Version=$VERSION' \
              -X 'ytmgo/internal/version.Commit=${COMMIT:0:7}' \
              -X 'ytmgo/internal/version.BuildDate=$BUILD_DATE'" \
            -o "ytmgo" \
            .

      - name: Package + checksum
        run: |
          set -euo pipefail
          asset="ytmgo_${{ matrix.asset_os }}_${{ matrix.arch }}.tar.gz"
          tar -czf "$asset" ytmgo
          sha256sum "$asset" | tee "${asset}.sha256"
          ls -la "$asset" "${asset}.sha256"

      # Hand the artifact to the release job rather than publishing from
      # here. Four matrix jobs calling the release action at once is a
      # race: each one looks for a release on this tag, all four find
      # none, and more than one creates it — which is how v1.0.2 and
      # v1.1.0 each ended up with a stray draft beside the real release,
      # both stamped the same second.
      - name: Hand the artifact to the release job
        uses: actions/upload-artifact@v7
        with:
          name: ytmgo_${{ matrix.asset_os }}_${{ matrix.arch }}
          path: |
            ytmgo_${{ matrix.asset_os }}_${{ matrix.arch }}.tar.gz
            ytmgo_${{ matrix.asset_os }}_${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  # ───────────────────────────────────────────────────────────────────
  # Publish the release — one job, so one release
  # ───────────────────────────────────────────────────────────────────
  release:
    name: publish the release
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write   # creates the release and uploads its assets
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Collect every platform's artifact
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Check all four platforms arrived
        run: |
          set -euo pipefail
          ls -la dist
          # Eight files: four tarballs and their checksums. Publishing a
          # partial set would ship a release the installer cannot use on
          # some architectures.
          n=$(find dist -type f | wc -l)
          [ "$n" -eq 8 ] || { echo "expected 8 files, found $n"; exit 1; }

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*

  # ───────────────────────────────────────────────────────────────────
  # Publish to Arch User Repository
  # ───────────────────────────────────────────────────────────────────
  aur:
    name: publish ${{ matrix.pkg }} to AUR
    runs-on: ubuntu-latest
    needs: [release]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    strategy:
      # One AUR repo per package, and one failing must not take the
      # other down: ytmgo builds from source, ytmgo-bin ships the
      # binaries this release just published.
      fail-fast: false
      matrix:
        include:
          - pkg: ytmgo
            flags: ""
          - pkg: ytmgo-bin
            flags: "--bin"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # This job pushes to the AUR over SSH and never talks back to
          # GitHub, so it does not need a token left in the git config
          # of the checkout while it does.
          persist-credentials: false

      - name: Generate PKGBUILD + .SRCINFO
        run: |
          bash dist/arch/generate-pkgbuild.sh "${{ github.ref_name }}" --out /tmp/aur-pkg ${{ matrix.flags }}

      - name: Push to AUR
        env:
          AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          # Write SSH key
          mkdir -p ~/.ssh
          echo "$AUR_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur

          # Add AUR host key
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null

          # Use the key for AUR
          cat >> ~/.ssh/config << 'CONFIG'
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
          CONFIG

          # Verify SSH works
          echo ">>> Testing SSH connection..."
          ssh -T aur@aur.archlinux.org 2>&1 || true

          # Configure git
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Clone AUR repo
          echo ">>> Cloning AUR repo..."
          git clone ssh://aur@aur.archlinux.org/${{ matrix.pkg }}.git /tmp/aur-repo
          cd /tmp/aur-repo

          # Update files
          cp /tmp/aur-pkg/PKGBUILD .
          cp /tmp/aur-pkg/.SRCINFO .

          # Commit and push
          git add PKGBUILD .SRCINFO
          if ! git diff --cached --quiet; then
            git commit -m "Update to ${{ github.ref_name }}"
            echo ">>> Pushing to AUR..."
            # HEAD:master, not master: ytmgo-bin does not exist on the
            # AUR until this first push, and a clone of an empty repo
            # takes its branch name from the runner's git default.
            git push origin HEAD:master
            echo "✓ ${{ matrix.pkg }} updated to ${{ github.ref_name }}"
          else
            echo "No changes — AUR already up to date."
          fi

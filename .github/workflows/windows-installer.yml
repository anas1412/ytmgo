name: windows-installer

# Builds the Windows installer, ytmgo-gui-setup.exe, and keeps it as an
# artifact. release.yml calls it for every `v*` tag and publishes the
# installer in the same release as the Linux binaries, so the release
# GitHub marks "Latest" carries both apps. Run by hand, it builds a test
# installer and publishes nothing.

on:
  workflow_call:
    inputs:
      tag:
        description: "the release's tag: v1.5.0"
        type: string
        required: true
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Built where it runs: the installer needs makensis, and the exe is
    # checked on the system it is for.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The installer's version is the release's, written into wails.json
      # for the build; a test build is 0.0.0 and calls itself dev.
      - name: Version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "$TAG" ]; then
            VERSION="${TAG#v}"
            echo "APP_VERSION=$TAG" >> "$GITHUB_ENV"
          else
            VERSION=0.0.0
            echo "APP_VERSION=dev" >> "$GITHUB_ENV"
          fi
          sed -i "s/\"productVersion\": *\"[^\"]*\"/\"productVersion\": \"$VERSION\"/" cmd/ytmgo-gui/wails.json
          grep productVersion cmd/ytmgo-gui/wails.json

      - name: Test
        run: go test -short $(go list ./internal/... | grep -v /internal/tui)

      - name: Install Wails and NSIS
        run: |
          set -euo pipefail
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
          choco install nsis -y --no-progress
          echo "C:\\Program Files (x86)\\NSIS" >> "$GITHUB_PATH"

      # yt-dlp ships beside the app (project.nsi). The pinned build,
      # checked against its checksum, as the app itself would fetch it.
      - name: Fetch yt-dlp
        run: |
          set -euo pipefail
          mkdir -p cmd/ytmgo-gui/build/bin
          go run ./cmd/fetchdep yt-dlp cmd/ytmgo-gui/build/bin

      - name: Build the installer
        working-directory: cmd/ytmgo-gui
        env:
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          wails build -platform windows/amd64 -nsis -trimpath \
            -ldflags "-s -w \
              -X 'ytmgo/internal/version.Version=$APP_VERSION' \
              -X 'ytmgo/internal/version.Commit=${COMMIT:0:7}' \
              -X 'ytmgo/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)'"
          cd build/bin
          ls -la
          sha256sum ytmgo-gui-setup.exe | tee ytmgo-gui-setup.exe.sha256

      - name: Keep the installer as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: ytmgo-gui-setup
          path: |
            cmd/ytmgo-gui/build/bin/ytmgo-gui-setup.exe
            cmd/ytmgo-gui/build/bin/ytmgo-gui-setup.exe.sha256
          if-no-files-found: error
          retention-days: 7

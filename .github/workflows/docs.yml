name: docs

# Builds the VitePress site and publishes it to GitHub Pages.
#
# Pages must be set to "GitHub Actions" as its source for this to be the
# thing that gets served — with the older "deploy from a branch" setting
# the repo root is published instead and this workflow's output is
# ignored.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
  # The nav shows the latest release tag and the star count, both read
  # from the GitHub API at build time. Without these two triggers the
  # site would keep showing whichever numbers were true when a docs file
  # last changed — cutting a release would not update the version beside
  # "Releases".
  release:
    types: [published]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy half-way; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # lastUpdated reads git history

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run docs:build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

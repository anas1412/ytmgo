        const at = (ev) => {
          const box = seek.getBoundingClientRect();
          return Math.min(Math.max((ev.clientX - box.left) / box.width, 0), 1);
        };
        updateSeek(at(e));
        const move = (ev) => updateSeek(at(ev));
        const up = (ev) => {
          audio.currentTime = at(ev) * audio.duration;
          seeking = false;
          seek.classList.remove("dragging");
          seek.removeEventListener("pointermove", move);
        };
        seek.addEventListener("pointermove", move);
        seek.addEventListener("pointerup", up, { once: true });
      });
      seek.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
          e.preventDefault();
          e.stopPropagation();
          seekBy(e.key === "ArrowRight" ? 5 : -5);
        }
      });

      // Volume is the TUI's Default Volume, saved in the settings both
      // apps share. Saving waits for the slider to settle.
      const volume = $("volume");
      let lastVolume = 80;
      let volumeTimer;
      function setVolume(v, persist = true) {
        v = Math.min(Math.max(Math.round(v), 0), 100);
        volume.value = v;
        volume.style.setProperty("--v", `${v}%`);
        audio.volume = v / 100;
        $("mute").classList.toggle("muted", v === 0);
        $("mute").setAttribute("aria-label", v === 0 ? "Unmute" : "Mute");
        if (!persist) return;
        clearTimeout(volumeTimer);
        volumeTimer = setTimeout(() => SetVolume(v), 250);
      }
      volume.addEventListener("input", () => setVolume(+volume.value));
      $("mute").addEventListener("click", () => {
        if (+volume.value > 0) {
          lastVolume = +volume.value;
          setVolume(0);
        } else setVolume(lastVolume || 80);
      });
      Volume().then((v) => setVolume(v, false));

      // The TUI's keys: Space, n / →, p / ←, l and h to seek 5s, + and −,
      // s shuffle, r repeat, e queue everything listed.
      function playerKey(e) {
        // A focused button, slider or splitter keeps Space and the arrows
        // for itself: Space presses the button, arrows move the slider.
        const control = document.activeElement?.matches("button, input, [role=slider], [role=separator]");
        if (control && (e.key === " " || e.key.startsWith("Arrow"))) return false;
        switch (e.key) {
          case " ":
            togglePlay();
            return true;
          case "n":
          case "ArrowRight":
            next();
            return true;
          case "p":
          case "ArrowLeft":
            prev();
            return true;
          case "l":
            seekBy(5);
            return true;
          case "h":
            seekBy(-5);
            return true;
          case "+":
          case "=":
            setVolume(+volume.value + 5);
            return true;
          case "-":
          case "_":
            setVolume(+volume.value - 5);
            return true;
          case "s":
            $("shuffle").click();
            return true;
          case "r":
            $("repeat").click();
            return true;
          case "e":
            queueAll();
            return true;
        }
        return false;
      }

      // Keyboard first, as in the terminal app: / to search, arrows or
      // j/k to move, Enter to queue, Escape back to the box.
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && drag?.active) {
          e.preventDefault();
          endDrag(false);
          return;
        }
        const typing = document.activeElement === query;
        if (e.key === "/" && !typing) {
          e.preventDefault();
          query.focus();
          query.select();
        } else if (e.key === "Escape") {
          query.focus();
          query.select();
        } else if (e.key === "y" && !typing) {
          openPanel("lyrics");
        } else if (!typing && playerKey(e)) {
          e.preventDefault();
        } else if (!results.length) {
          return;
        } else if (e.key === "ArrowDown" || (!typing && e.key === "j")) {
          e.preventDefault();
          select(selected + 1);
        } else if (e.key === "ArrowUp" || (!typing && e.key === "k")) {
          e.preventDefault();
          select(selected - 1);
        } else if (e.key === "Enter" && !typing && !document.activeElement?.matches("button")) {
          enqueue(results[selected]);
        }
      });

      // Media keys and the system's now-playing controls.
      if ("mediaSession" in navigator) {
        const ms = navigator.mediaSession;
        ms.setActionHandler("play", togglePlay);
        ms.setActionHandler("pause", togglePlay);
        ms.setActionHandler("nexttrack", next);
        ms.setActionHandler("previoustrack", prev);
      }

      // ── Connection ───────────────────────────────────────────────────
      // A slim banner while offline. Coming back runs the search that
      // failed and resumes a song the connection cut off.
      function connection() {
        $("offline").hidden = navigator.onLine;
        if (!navigator.onLine) return;
        if (failedQuery && query.value.trim() === failedQuery) run(failedQuery);
        if (resumeAt != null && now) {
          const at = resumeAt;
          resumeAt = null;
          start(at);
        }
      }
      window.addEventListener("online", connection);
      window.addEventListener("offline", connection);

      new ResizeObserver(apply).observe(app);
      apply();
      connection();
      empty();
      Queue().then(setQueue);
    </script>
  </body>
</html>

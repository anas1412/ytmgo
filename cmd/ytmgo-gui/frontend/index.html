<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Google's image servers reset the connection when the referer is
         the app's own origin (localhost, wails://), so covers would fail
         to load. Send none, for every image and stream the page fetches. -->
    <meta name="referrer" content="no-referrer" />
    <title>ytmgo</title>
    <style>
      /* ytmgo's own dark palette (internal/tui/theme.go, adaptive()).
         Each accent has one meaning: violet is focus and the cursor,
         mint is playing and active, pink is an error. */
      :root {
        --bg: #0d0d12;
        --surface: #16161f;
        --raised: #1d1d2b;
        --hover: #1a1a2e;
        --border: #2a2a3e;
        --violet: #7c3aed;
        --violet-text: #a78bfa;
        --mint: #06d6a0;
        --pink: #f72585;
        --text: #ececf1;
        --mid: #a3a3b5;
        --dim: #6e6e82;

        --row: 60px;
        --radius-s: 6px;
        --radius-m: 10px;
        --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
        --fast: 140ms;
        --slow: 320ms;
        font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
      }
      @media (prefers-reduced-motion: reduce) {
        :root {
          --fast: 0ms;
          --slow: 0ms;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-size: 14px;
        line-height: 1.4;
        user-select: none;
        -webkit-font-smoothing: antialiased;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        cursor: pointer;
      }
      :focus-visible {
        outline: 2px solid var(--violet-text);
        outline-offset: 2px;
      }
      svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: none;
      }

      /* ── Shell: sidebar | main view | right panel, player below ──────
         The columns between panels are the splitters. Their widths live
         in --side-w and --right-w, set by dragging. */
      .app {
        --side-w: 240px;
        --right-w: 320px;
        height: 100%;
        display: grid;
        grid-template-columns: var(--side-w) 8px minmax(0, 1fr) 8px var(--right-w);
        grid-template-rows: minmax(0, 1fr) auto;
        row-gap: 8px;
        padding: 8px;
        transition: grid-template-columns var(--slow) var(--ease);
      }
      .app.right-closed {
        grid-template-columns: var(--side-w) 8px minmax(0, 1fr) 0 0;
      }
      /* While dragging, the columns follow the pointer exactly. */
      .app.dragging {
        transition: none;
        cursor: col-resize;
      }
      .app.dragging * {
        user-select: none;
      }

      nav {
        grid-row: 1;
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
        padding: 18px 10px;
        overflow: hidden;
        background: var(--surface);
        border-radius: var(--radius-m);
      }

      .splitter {
        grid-row: 1;
        position: relative;
        cursor: col-resize;
        touch-action: none;
      }
      .splitter::after {
        content: "";
        position: absolute;
        top: 12px;
        bottom: 12px;
        left: 3px;
        width: 2px;
        border-radius: 1px;
        background: transparent;
        transition: background var(--fast);
      }
      .splitter:hover::after {
        background: var(--border);
      }
      .splitter:focus-visible {
        outline: 0;
      }
      .splitter:focus-visible::after,
      .app.dragging .splitter.active::after {
        background: var(--violet-text);
      }
      .app.right-closed .split-right,
      .app.right-closed .side-panel {
        display: none;
      }
      .brand {
        display: block;
        padding: 2px 10px 22px;
      }
      .brand img {
        display: block;
        height: 34px;
        width: auto;
        pointer-events: none;
      }
      .brand .mark {
        display: none;
        height: 32px;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 14px;
        width: 100%;
        padding: 10px;
        border-radius: var(--radius-s);
        color: var(--mid);
        font-weight: 600;
        text-align: left;
        white-space: nowrap;
        transition: color var(--fast), background var(--fast);
      }
      .nav-item:hover:not([aria-disabled="true"]) {
        color: var(--text);
        background: var(--hover);
      }
      .nav-item[aria-current="page"] {
        color: var(--text);
      }
      .nav-item[aria-current="page"] svg {
        color: var(--mint);
      }
      .nav-item[aria-disabled="true"] {
        color: var(--dim);
        cursor: default;
      }
      .nav-gap {
        height: 14px;
      }

      .view,
      .side-panel {
        grid-row: 1;
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        background: var(--surface);
        border-radius: var(--radius-m);
        overflow: hidden;
      }
      /* Each panel lays itself out by its own width, not the window's,
         since the splitters decide how wide it is. */
      .view {
        container: view / inline-size;
      }
      .side-panel {
        container: side / inline-size;
      }

      /* ── Right panel: Queue and Lyrics ────────────────────────────── */
      .panel-head {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 14px 12px 10px 16px;
      }
      .tab {
        padding: 6px 12px;
        border-radius: 999px;
        color: var(--mid);
        font-weight: 600;
        white-space: nowrap;
        transition: color var(--fast), background var(--fast);
      }
      .tab:hover {
        color: var(--text);
      }
      .tab[aria-selected="true"] {
        background: var(--text);
        color: var(--bg);
      }
      .icon-btn {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        color: var(--mid);
        transition: color var(--fast), background var(--fast);
      }
      .icon-btn:hover {
        color: var(--text);
        background: var(--hover);
      }
      .panel-head .icon-btn {
        margin-left: auto;
      }
      .panel-body {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
      }
      .panel-body .notice {
        padding: 56px 20px;
      }
      .panel-body .notice strong {
        font-size: 17px;
      }

      /* ── Search field ─────────────────────────────────────────────── */
      .search-head {
        padding: 18px 24px 14px;
      }
      .field {
        position: relative;
        display: flex;
        align-items: center;
        gap: 10px;
        max-width: 560px;
        height: 46px;
        padding: 0 14px 0 16px;
        background: var(--raised);
        border: 1px solid transparent;
        border-radius: 999px;
        transition: border-color var(--fast), background var(--fast);
      }
      .field:hover {
        background: #222233;
      }
      .field:focus-within {
        border-color: var(--violet);
        background: #222233;
      }
      .field .prompt {
        color: var(--mint);
        font-weight: 700;
      }
      #query {
        flex: 1;
        min-width: 0;
        height: 100%;
        background: none;
        border: 0;
        outline: 0;
        color: var(--text);
        font: inherit;
        font-size: 15px;
        user-select: text;
      }
      #query::placeholder {
        color: var(--dim);
      }
      #query::-webkit-search-cancel-button {
        display: none;
      }
      #clear {
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        color: var(--mid);
        opacity: 0;
        pointer-events: none;
        transition: opacity var(--fast), background var(--fast);
      }
      .field.has-text #clear {
        opacity: 1;
        pointer-events: auto;
      }
      #clear:hover {
        background: var(--hover);
        color: var(--text);
      }
      kbd {
        min-width: 22px;
        padding: 1px 6px;
        border: 1px solid var(--border);
        border-radius: 5px;
        color: var(--dim);
        font: 12px "Cascadia Mono", ui-monospace, monospace;
        text-align: center;
      }
      /* The field's working line: shows a search is in flight without
         taking the results away. */
      .field::after {
        content: "";
        position: absolute;
        left: 24px;
        right: 24px;
        bottom: -1px;
        height: 2px;
        border-radius: 2px;
        background: linear-gradient(90deg, transparent, var(--violet-text), transparent);
        background-size: 40% 100%;
        background-repeat: no-repeat;
        opacity: 0;
        transition: opacity var(--fast);
      }
      .field.busy::after {
        opacity: 1;
        animation: sweep 1.1s linear infinite;
      }
      @keyframes sweep {
        from {
          background-position: -40% 0;
        }
        to {
          background-position: 140% 0;
        }
      }

      /* ── Results ──────────────────────────────────────────────────── */
      .results {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 0 16px 16px;
        scrollbar-width: thin;
        scrollbar-color: var(--border) transparent;
      }
      .results h2 {
        margin: 6px 8px 10px;
        font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .head-row,
      .track {
        display: grid;
        /* art, title and artist, album, length, add */
        grid-template-columns: 44px minmax(0, 1.6fr) minmax(0, 1fr) 56px 32px;
        align-items: center;
        gap: 14px;
        padding: 0 12px;
      }
      .head-row {
        height: 34px;
        margin-bottom: 6px;
        border-bottom: 1px solid var(--border);
        color: var(--dim);
        font-size: 13px;
      }
      .head-row span:last-child,
      .time {
        text-align: right;
      }
      .list {
        position: relative;
      }
      /* The cursor: one bar that glides to the selected row, as the TUI's
         highlight moves, rather than rows lighting up on their own. */
      .cursor {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: var(--row);
        border-radius: var(--radius-s);
        background: var(--violet);
        opacity: 0;
        transform: translateY(0);
        transition: transform var(--fast) var(--ease), opacity var(--fast);
        pointer-events: none;
      }
      .list.has-cursor .cursor {
        opacity: 1;
      }
      .track {
        position: relative;
        height: var(--row);
        border-radius: var(--radius-s);
        transition: background var(--fast);
      }
      .track:hover:not(.selected) {
        background: var(--hover);
      }
      .art-wrap {
        position: relative;
        width: 44px;
        height: 44px;
        border-radius: 4px;
        overflow: hidden;
        background: var(--raised);
      }
      .art {
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        transition: opacity var(--slow);
      }
      .art.loaded {
        opacity: 1;
      }
      .art-wrap .play {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgb(13 13 18 / 55%);
        color: #fff;
        opacity: 0;
        transition: opacity var(--fast);
      }
      .track:hover .play,
      .track.selected .play {
        opacity: 1;
      }
      .play svg {
        fill: currentColor;
        stroke: none;
      }
      .who {
        min-width: 0;
      }
      .title,
      .artist,
      .album {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .title {
        font-size: 15px;
        font-weight: 600;
        color: var(--text);
      }
      .artist,
      .album,
      .time {
        color: var(--mid);
        transition: color var(--fast);
      }
      .time {
        font-variant-numeric: tabular-nums;
      }
      .track.selected .title {
        color: #fff;
      }
      .track.selected .artist,
      .track.selected .album,
      .track.selected .time {
        color: #ede9fe;
      }

      /* One entrance per search: the rows arrive together, a beat apart. */
      .track.enter {
        animation: arrive var(--slow) var(--ease) both;
      }
      @keyframes arrive {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
      }

      /* Placeholder rows while the first results are on their way. */
      .skeleton .bar {
        height: 10px;
        border-radius: 5px;
        background: linear-gradient(90deg, var(--raised) 0%, #26263a 50%, var(--raised) 100%);
        background-size: 200% 100%;
        animation: shimmer 1.2s ease-in-out infinite;
      }
      .skeleton .art-wrap {
        animation: shimmer 1.2s ease-in-out infinite;
        background: linear-gradient(90deg, var(--raised) 0%, #26263a 50%, var(--raised) 100%);
        background-size: 200% 100%;
      }
      .skeleton .bar + .bar {
        margin-top: 8px;
      }
      @keyframes shimmer {
        from {
          background-position: 100% 0;
        }
        to {
          background-position: -100% 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .skeleton .bar,
        .skeleton .art-wrap,
        .field.busy::after {
          animation: none;
        }
      }

      .notice {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 72px 24px;
        text-align: center;
        animation: arrive var(--slow) var(--ease) both;
      }
      .notice strong {
        font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
        font-size: 20px;
      }
      .notice p {
        max-width: 42ch;
        margin: 0;
        color: var(--mid);
      }
      .notice .detail {
        max-width: 60ch;
        margin-top: 6px;
        color: var(--dim);
        font-size: 12px;
        text-align: left;
      }
      .notice .detail summary {
        cursor: pointer;
        text-align: center;
        list-style: none;
      }
      .notice .detail summary:hover {
        color: var(--mid);
      }
      .notice .detail code {
        display: block;
        margin-top: 8px;
        padding: 10px 12px;
        border-radius: var(--radius-s);
        background: var(--bg);
        font: 12px/1.5 "Cascadia Mono", ui-monospace, monospace;
        white-space: pre-wrap;
        word-break: break-word;
        user-select: text;
      }
      .offline {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0 24px 10px;
        padding: 9px 14px;
        border-radius: var(--radius-s);
        background: var(--raised);
        color: var(--mid);
        font-size: 13px;
        animation: arrive var(--slow) var(--ease) both;
      }
      .offline[hidden] {
        display: none;
      }
      .offline .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--pink);
        flex: none;
      }
      .art-wrap.missing {
        display: grid;
        place-items: center;
      }
      .art-wrap.missing img {
        display: none;
      }
      .art-wrap.missing::after {
        content: "♪";
        color: var(--dim);
        font-size: 18px;
      }
      .notice.error strong {
        color: var(--pink);
      }
      .pill {
        margin-top: 8px;
        padding: 9px 22px;
        border-radius: 999px;
        background: var(--text);
        color: var(--bg);
        font-weight: 700;
        transition: transform var(--fast) var(--ease), background var(--fast);
      }
      .pill:hover {
        transform: scale(1.04);
        background: #fff;
      }
      .pill:active {
        transform: scale(0.98);
      }

      /* ── Now playing ──────────────────────────────────────────────── */
      .player {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) minmax(0, 1fr);
        align-items: center;
        gap: 16px;
        height: 76px;
        padding: 0 16px;
      }
      .np {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }
      .np .art-wrap {
        width: 52px;
        height: 52px;
      }
      .np-text {
        flex: 1;
        min-width: 0;
        color: var(--dim);
      }
      .np-title {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        color: var(--text);
        font-weight: 600;
      }
      .np-sub {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        color: var(--mid);
        font-size: 13px;
      }
      .np-text.change .np-title,
      .np-text.change .np-sub {
        animation: arrive var(--slow) var(--ease) both;
      }
      /* The line under the title says who the artist is, or, for a
         moment, what just happened. Problems in pink, the rest in grey;
         no box around either. */
      .np-line {
        position: relative;
        height: 18px;
        overflow: hidden;
      }
      .np-line > * {
        position: absolute;
        inset: 0;
        line-height: 18px;
        transition: opacity var(--fast), transform var(--slow) var(--ease);
      }
      .np-status {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        color: var(--mid);
        font-size: 13px;
        opacity: 0;
        transform: translateY(100%);
      }
      .np-status.error {
        color: var(--pink);
      }
      .np-text.has-status .np-sub {
        opacity: 0;
        transform: translateY(-100%);
      }
      .np-text.has-status .np-status {
        opacity: 1;
        transform: none;
      }
      .controls {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      .buttons {
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .buttons button {
        display: grid;
        place-items: center;
        color: var(--mid);
        transition: color var(--fast), transform var(--fast) var(--ease);
      }
      .buttons button:disabled {
        color: var(--border);
        cursor: default;
      }
      .buttons button:not(:disabled):hover {
        color: var(--text);
      }
      .buttons button:not(:disabled):active {
        transform: scale(0.94);
      }
      .buttons .main {
        position: relative;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: var(--text);
        color: var(--bg);
      }
      .buttons .main:disabled {
        background: var(--raised);
        color: var(--dim);
      }
      .buttons .main svg,
      .buttons .skip svg {
        fill: currentColor;
        stroke: none;
      }
      .buttons .main:not(:disabled):hover {
        transform: scale(1.06);
        color: var(--bg);
      }
      .main .i-pause,
      .main .spinner,
      .main.playing .i-play,
      .main.loading .i-play,
      .main.loading .i-pause {
        display: none;
      }
      .main.playing .i-pause {
        display: block;
      }
      .main.loading .spinner {
        display: block;
        width: 16px;
        height: 16px;
        border: 2px solid currentColor;
        border-right-color: transparent;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Seek bar: violet as it fills, with a knob that shows on hover. */
      .seek {
        position: relative;
        flex: 1;
        height: 14px;
        display: flex;
        align-items: center;
        cursor: pointer;
        touch-action: none;
      }
      .seek::before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        height: 4px;
        border-radius: 2px;
        background: var(--raised);
      }
      .seek-fill {
        position: absolute;
        left: 0;
        height: 4px;
        width: 0;
        border-radius: 2px;
        background: var(--text);
        transition: background var(--fast);
      }
      .seek-fill::after {
        content: "";
        position: absolute;
        right: -6px;
        top: -4px;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #fff;
        opacity: 0;
        transition: opacity var(--fast);
      }
      .seek.loading::before {
        background: linear-gradient(90deg, var(--raised), var(--border), var(--raised));
        background-size: 40% 100%;
        background-repeat: no-repeat;
        background-color: var(--raised);
        animation: sweep 1.1s linear infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .seek.loading::before {
          animation: none;
        }
      }
      .seek:hover .seek-fill,
      .seek.dragging .seek-fill,
      .seek:focus-visible .seek-fill {
        background: var(--violet-text);
      }
      .seek:hover .seek-fill::after,
      .seek.dragging .seek-fill::after,
      .seek:focus-visible .seek-fill::after {
        opacity: 1;
      }

      /* Volume: the same look as the seek bar, on a native range input. */
      .volume {
        --v: 70%;
        width: 96px;
        height: 14px;
        margin: 0;
        appearance: none;
        background: transparent;
        cursor: pointer;
      }
      .volume::-webkit-slider-runnable-track {
        height: 4px;
        border-radius: 2px;
        background: linear-gradient(90deg, var(--text) var(--v), var(--raised) var(--v));
      }
      .volume:hover::-webkit-slider-runnable-track {
        background: linear-gradient(90deg, var(--violet-text) var(--v), var(--raised) var(--v));
      }
      .volume::-webkit-slider-thumb {
        appearance: none;
        width: 12px;
        height: 12px;
        margin-top: -4px;
        border-radius: 50%;
        background: #fff;
        opacity: 0;
        transition: opacity var(--fast);
      }
      .volume:hover::-webkit-slider-thumb,
      .volume:focus-visible::-webkit-slider-thumb {
        opacity: 1;
      }
      #mute.muted .wave {
        display: none;
      }

      /* Shuffle and repeat: mint when on, as the TUI's mode labels are.
         Repeat-one carries a small 1. */
      .buttons .mode {
        position: relative;
        color: var(--dim);
      }
      .buttons .mode[aria-pressed="true"] {
        color: var(--mint);
      }
      .mode .badge {
        display: none;
        position: absolute;
        top: -5px;
        right: -7px;
        min-width: 13px;
        height: 13px;
        border-radius: 7px;
        background: var(--mint);
        color: var(--bg);
        font-size: 9px;
        font-weight: 800;
        line-height: 13px;
        text-align: center;
      }
      .mode.one .badge {
        display: block;
      }

      /* Add to queue, on each result: it shows on hover or selection, and
         turns into a tick for a moment once the song is in. */
      .track .add {
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        color: var(--mid);
        opacity: 0;
        transition: opacity var(--fast), background var(--fast), color var(--fast);
      }
      .track:hover .add,
      .track.selected .add,
      .track .add:focus-visible,
      .track .add.done {
        opacity: 1;
      }
      .track .add:hover {
        color: var(--text);
        background: var(--hover);
      }
      .track.selected .add {
        color: #ede9fe;
      }
      .track.selected .add:hover {
        background: rgb(255 255 255 / 14%);
      }
      .track .add.done {
        color: var(--mint);
      }
      .track.selected .add.done {
        color: #b9f8e5;
      }
      /* ✓: the song is on disk, as in the TUI. */
      .dl {
        color: var(--mint);
        margin-right: 5px;
      }

      /* ── Queue panel ──────────────────────────────────────────────── */
      .q-summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 2px 16px 8px;
        color: var(--dim);
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }
      .q-clear {
        padding: 4px 10px;
        border-radius: 999px;
        color: var(--mid);
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
        transition: color var(--fast), background var(--fast);
      }
      .q-clear:hover {
        color: var(--text);
        background: var(--hover);
      }
      .q-clear.confirm {
        color: var(--pink);
      }
      .q-list {
        position: relative;
        padding: 0 8px 12px;
      }
      .q-row {
        display: grid;
        grid-template-columns: 22px 40px minmax(0, 1fr) auto 26px;
        align-items: center;
        gap: 10px;
        height: 52px;
        padding: 0 6px;
        border-radius: var(--radius-s);
        outline-offset: -2px;
        transition: background var(--fast), opacity var(--fast);
      }
      .q-row:hover {
        background: var(--hover);
      }
      .q-num {
        color: var(--dim);
        font-size: 13px;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .q-row .art-wrap {
        width: 40px;
        height: 40px;
      }
      .q-who {
        min-width: 0;
      }
      .q-title,
      .q-artist {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .q-title {
        font-weight: 600;
      }
      .q-artist {
        color: var(--mid);
        font-size: 13px;
      }
      .q-time {
        color: var(--dim);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      .q-row.current .q-title,
      .q-row.current .q-num {
        color: var(--mint);
      }
      .q-remove {
        display: grid;
        place-items: center;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        color: var(--dim);
        opacity: 0;
        transition: opacity var(--fast), color var(--fast), background var(--fast);
      }
      .q-remove svg {
        width: 16px;
        height: 16px;
      }
      .q-row:hover .q-remove,
      .q-row:focus-visible .q-remove,
      .q-remove:focus-visible {
        opacity: 1;
      }
      .q-remove:hover {
        color: var(--text);
        background: var(--raised);
      }
      @container side (max-width: 300px) {
        .q-time {
          display: none;
        }
      }
      /* A row that just landed from a drag or an add. */
      .q-row.landed {
        animation: landed 900ms var(--ease);
      }
      @keyframes landed {
        from {
          background: rgb(124 58 237 / 32%);
        }
      }

      /* ── Drag and drop ────────────────────────────────────────────── */
      body.drag-song,
      body.drag-song * {
        cursor: grabbing !important;
      }
      .q-row.dragged-from,
      .track.dragged-from {
        opacity: 0.35;
      }
      .drop-line {
        position: absolute;
        left: 8px;
        right: 8px;
        height: 2px;
        margin-top: -1px;
        border-radius: 1px;
        background: var(--violet-text);
        pointer-events: none;
        transition: top var(--fast) var(--ease);
      }
      .drop-line::before {
        content: "";
        position: absolute;
        left: -4px;
        top: -3px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        border: 2px solid var(--violet-text);
        background: var(--surface);
        box-sizing: border-box;
      }
      .panel-body.drop-target {
        box-shadow: inset 0 0 0 2px rgb(167 139 250 / 35%);
      }
      #ghost {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 50;
        display: none;
        align-items: center;
        gap: 10px;
        max-width: 260px;
        padding: 6px 14px 6px 6px;
        border-radius: var(--radius-m);
        background: var(--raised);
        box-shadow: 0 16px 34px -14px rgb(0 0 0 / 80%);
        pointer-events: none;
      }
      #ghost.show {
        display: flex;
      }
      #ghost .art-wrap {
        width: 36px;
        height: 36px;
        flex: none;
      }
      #ghost .g-text {
        min-width: 0;
      }
      #ghost .g-title {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        font-weight: 600;
      }
      #ghost .g-sub {
        color: var(--mid);
        font-size: 12px;
      }

      /* The row that is playing, in mint, as in the TUI's queue. */
      .track.playing .title {
        color: var(--mint);
      }
      .track.playing.selected .title {
        color: #b9f8e5;
      }

      .progress {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        max-width: 560px;
        color: var(--dim);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      .extras {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 10px;
        color: var(--dim);
      }
      .extras .icon-btn[aria-pressed="true"] {
        color: var(--mint);
      }

      /* A sidebar dragged narrow folds to icons, as Spotify's does. */
      .app.side-collapsed .nav-item span,
      .app.side-collapsed .brand .wordmark {
        display: none;
      }
      .app.side-collapsed .brand .mark {
        display: block;
        margin: 0 auto;
      }
      .app.side-collapsed .brand {
        padding-left: 0;
        padding-right: 0;
      }
      .app.side-collapsed .nav-item {
        justify-content: center;
        padding-left: 0;
        padding-right: 0;
      }

      /* A narrow main view drops the album column first. */
      @container view (max-width: 560px) {
        .head-row,
        .track {
          grid-template-columns: 44px minmax(0, 1fr) 56px 32px;
        }
        .album,
        .head-row .col-album {
          display: none;
        }
      }
      @container view (max-width: 420px) {
        .search-head {
          padding-left: 14px;
          padding-right: 14px;
        }
        .field kbd {
          display: none;
        }
      }

      /* The player keeps its controls whole; on a narrow window the
         extras give way first. */
      @media (max-width: 760px) {
        .extras .volume,
        .extras .vol,
        #version {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="app" id="app">
      <nav aria-label="Main">
        <div class="brand">
          <img class="wordmark" src="ytmgo-logo.png" alt="ytmgo" />
          <img class="mark" src="ytmgo-icon.png" alt="ytmgo" />
        </div>
        <button class="nav-item" aria-current="page" title="Search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" /></svg>
          <span>Search</span>
        </button>
        <div class="nav-gap"></div>
        <!-- Not built yet: shown so the layout reads as it will, but inert. -->
        <button class="nav-item" aria-disabled="true" title="Library is on its way">
          <svg viewBox="0 0 24 24"><path d="m16 6 4 14" /><path d="M12 6v14" /><path d="M8 8v12" /><path d="M4 4v16" /></svg>
          <span>Library</span>
        </button>
        <button class="nav-item" aria-disabled="true" title="Favourites are on their way">
          <svg viewBox="0 0 24 24"><path d="M2 9.5a5.5 5.5 0 0 1 9.6-3.7.6.6 0 0 0 .8 0A5.5 5.5 0 0 1 22 9.5c0 2.3-1.5 4-3 5.5l-5.5 5.3a2 2 0 0 1-3 0L5 15c-1.5-1.5-3-3.2-3-5.5" /></svg>
          <span>Favourites</span>
        </button>
        <button class="nav-item" aria-disabled="true" title="History is on its way">
          <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.8 9.8 0 0 0-6.7 2.7L3 8" /><path d="M3 3v5h5" /><path d="M12 7v5l4 2" /></svg>
          <span>History</span>
        </button>
        <button class="nav-item" aria-disabled="true" title="Downloads are on their way">
          <svg viewBox="0 0 24 24"><path d="M12 15V3" /><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><path d="m7 10 5 5 5-5" /></svg>
          <span>Downloads</span>
        </button>
      </nav>

      <div class="splitter split-left" role="separator" aria-orientation="vertical" aria-label="Resize sidebar" tabindex="0" title="Drag to resize, double-click to reset"></div>

      <section class="view" aria-label="Search">
        <div class="search-head">
          <form class="field" id="search" autocomplete="off" role="search">
            <span class="prompt" aria-hidden="true">&gt;</span>
            <input id="query" type="search" placeholder="What do you want to hear?" aria-label="Search YouTube Music" autofocus />
            <button type="button" id="clear" aria-label="Clear search">
              <svg viewBox="0 0 24 24"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
            </button>
            <kbd aria-hidden="true">/</kbd>
          </form>
        </div>
        <div class="offline" id="offline" role="status" hidden>
          <span class="dot" aria-hidden="true"></span>
          You’re offline. Search and playback come back with the connection.
        </div>
        <div class="results" id="results"></div>
      </section>

      <div class="splitter split-right" role="separator" aria-orientation="vertical" aria-label="Resize side panel" tabindex="0" title="Drag to resize, double-click to reset"></div>

      <aside class="side-panel" aria-label="Queue and lyrics">
        <div class="panel-head" role="tablist">
          <button class="tab" role="tab" data-tab="queue" aria-selected="true">Queue</button>
          <button class="tab" role="tab" data-tab="lyrics" aria-selected="false">Lyrics</button>
          <button class="icon-btn" id="close-panel" aria-label="Close panel" title="Close">
            <svg viewBox="0 0 24 24"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
          </button>
        </div>
        <div class="panel-body" id="panel-body"></div>
      </aside>

      <footer class="player" aria-label="Now playing">
        <div class="np">
          <div class="art-wrap"><img class="art" id="np-art" alt="" /></div>
          <div class="np-text" id="np-text">
            <div class="np-title" id="np-title"></div>
            <div class="np-line">
              <div class="np-sub" id="np-sub">Nothing playing yet</div>
              <div class="np-status" id="np-status" role="status" aria-live="polite"></div>
            </div>
          </div>
        </div>
        <div class="controls">
          <div class="buttons">
            <button class="mode" id="shuffle" aria-pressed="false" aria-label="Shuffle" title="Shuffle (s)">
              <svg viewBox="0 0 24 24"><path d="m18 14 4 4-4 4" /><path d="m18 2 4 4-4 4" /><path d="M2 18h1.97a4 4 0 0 0 3.3-1.7l5.45-8.6a4 4 0 0 1 3.3-1.7H22" /><path d="M2 6h1.97a4 4 0 0 1 3.27 1.7" /><path d="M22 18h-5.92a4 4 0 0 1-3.3-1.7l-.36-.55" /></svg>
            </button>
            <button class="skip" id="prev" disabled aria-label="Previous" title="Previous (p)">
              <svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z" /></svg>
            </button>
            <button class="main" id="toggle" disabled aria-label="Play" title="Play (Space)">
              <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" /></svg>
              <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z" /></svg>
              <span class="spinner" aria-hidden="true"></span>
            </button>
            <button class="skip" id="next" disabled aria-label="Next" title="Next (n)">
              <svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z" /></svg>
            </button>
            <button class="mode" id="repeat" aria-pressed="false" aria-label="Repeat: off" title="Repeat (r)">
              <svg viewBox="0 0 24 24"><path d="m17 2 4 4-4 4" /><path d="M3 11v-1a4 4 0 0 1 4-4h14" /><path d="m7 22-4-4 4-4" /><path d="M21 13v1a4 4 0 0 1-4 4H3" /></svg>
              <span class="badge" aria-hidden="true">1</span>
            </button>
          </div>
          <div class="progress">
            <span id="t-now">0:00</span>
            <div class="seek" id="seek" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" tabindex="0">
              <div class="seek-fill" id="seek-fill"></div>
            </div>
            <span id="t-end">0:00</span>
          </div>
        </div>
        <div class="extras">
          <button class="icon-btn" data-open="lyrics" aria-pressed="false" aria-label="Lyrics" title="Lyrics (y)">
            <svg viewBox="0 0 24 24"><path d="m12 8-9.04 9.06a2.82 2.82 0 1 0 3.98 3.98L16 12" /><circle cx="17" cy="7" r="5" /></svg>
          </button>
          <button class="icon-btn" data-open="queue" aria-pressed="true" aria-label="Queue" title="Queue">
            <svg viewBox="0 0 24 24"><path d="M21 15V6" /><path d="M18.5 18a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z" /><path d="M12 12H3" /><path d="M16 6H3" /><path d="M12 18H3" /></svg>
          </button>
          <button class="icon-btn vol" id="mute" aria-label="Mute" title="Mute">
            <svg viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4z" /><path class="wave" d="M15.5 8.5a5 5 0 0 1 0 7" /></svg>
          </button>
          <input class="volume" id="volume" type="range" min="0" max="100" value="70" aria-label="Volume" title="Volume (+ / −)" />
          <span id="version"></span>
        </div>
      </footer>
    </div>
    <audio id="audio" preload="auto"></audio>
    <div id="ghost" aria-hidden="true"></div>

    <script type="module">
      import {
        Search,
        StreamURL,
        Version,
        Queue,
        PlayNow,
        Add,
        AddAll,
        Jump,
        Remove,
        Clear,
        Ended,
        Skip,
        Back,
        Move,
        Insert,
        ToggleShuffle,
        CycleRepeat,
        Volume,
        SetVolume,
      } from "./wailsjs/go/gui/App.js";

      const $ = (id) => document.getElementById(id);
      const query = $("query");
      const field = $("search");
      const pane = $("results");
      const ROW = 60;

      let results = [];
      let selected = -1;
      let lastQuery = "";
      // Each search gets a number, so a slow answer to an old query
      // cannot overwrite the results of a newer one.
      let seq = 0;
      let debounce;
      // A search that failed, run again when the connection comes back.
      let failedQuery = "";

      Version().then((v) => ($("version").textContent = v));

      const el = (tag, cls, text) => {
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text != null) n.textContent = text;
        return n;
      };
      const icon = (path) => {
        const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        s.setAttribute("viewBox", "0 0 24 24");
        s.innerHTML = path;
        return s;
      };
      const ICON_PLUS = '<path d="M12 5v14" /><path d="M5 12h14" />';
      const ICON_CHECK = '<path d="M20 6 9 17l-5-5" />';
      const ICON_X = '<path d="M18 6 6 18" /><path d="m6 6 12 12" />';

      // Covers come sized for the TUI's full-resolution art (544px).
      // Google's image server sizes on request, so a 44px thumbnail asks
      // for 120px (twice that, for sharp HiDPI) — 13KB instead of 170KB.
      const sized = (url, px) => url.replace(/=w\d+-h\d+/, `=w${px}-h${px}`);
      const duration = (secs) =>
        secs ? `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, "0")}` : "";
      // A queue's total, as the TUI's header has it: H:MM:SS past an hour.
      function total(secs) {
        const h = Math.floor(secs / 3600);
        const m = Math.floor((secs % 3600) / 60);
        const s = String(secs % 60).padStart(2, "0");
        return h ? `${h}:${String(m).padStart(2, "0")}:${s}` : `${m}:${s}`;
      }
      // Old rows stored a play count where the album goes; the TUI hides
      // those, and so does this (tui/actions.go albumLabel).
      const albumOf = (t) => (t.album && !/ (plays|views)$/.test(t.album) ? t.album : "");

      // A cover image that retries once and falls back to a music note.
      function cover(url, px) {
        const wrap = el("div", "art-wrap");
        if (!url) {
          wrap.classList.add("missing");
          return wrap;
        }
        const img = el("img", "art");
        img.alt = "";
        img.loading = "lazy";
        img.addEventListener("load", () => img.classList.add("loaded"));
        img.addEventListener("error", () => {
          if (img.dataset.retried) {
            wrap.classList.add("missing");
            img.remove();
            return;
          }
          img.dataset.retried = "1";
          // Clearing src first, as the same src again may not refetch.
          const src = img.src;
          img.removeAttribute("src");
          setTimeout(() => (img.src = src), 900);
        });
        img.src = sized(url, px);
        wrap.append(img);
        return wrap;
      }

      // Playback says what happened in the player itself, on the line
      // under the title. A message that needs the user to act (offline,
      // stopped) stays until a song starts; one that only reports (a
      // skip) gives the line back to the artist after a few seconds.
      let sayTimer;
      let sayingSticky = false;
      // full is the whole sentence, on hover and for screen readers; the
      // line itself has room for a few words.
      function say(text, { error = false, sticky = false, full = text } = {}) {
        const st = $("np-status");
        st.textContent = text;
        st.title = full;
        st.setAttribute("aria-label", full);
        st.classList.toggle("error", error);
        $("np-text").classList.add("has-status");
        sayingSticky = sticky;
        clearTimeout(sayTimer);
        if (!sticky) sayTimer = setTimeout(unsay, 4500);
      }
      function unsay() {
        clearTimeout(sayTimer);
        sayingSticky = false;
        $("np-text").classList.remove("has-status");
      }

      // Go sends failures as a Problem (internal/gui/problem.go): a kind
      // the page has words for, and the original text for "Show details".
      function problemOf(err) {
        try {
          const p = JSON.parse(String(err));
          if (p && p.kind) return p;
        } catch {}
        return { kind: "other", detail: String(err) };
      }
      const SEARCH_COPY = {
        offline: ["You’re offline", "Search needs an internet connection. It runs again on its own once you’re back online."],
        timeout: ["YouTube Music didn’t answer", "It took too long to respond. Try again in a moment."],
        "missing-tool": ["yt-dlp isn’t installed", "ytmgo needs yt-dlp to find and play music."],
        unavailable: ["That isn’t available", "YouTube Music won’t show it here. Try a different search."],
        other: ["Search didn’t work", "Something went wrong talking to YouTube Music. Try again."],
      };

      function notice(target, title, body, action, detail) {
        const box = el("div", "notice" + (action ? " error" : ""));
        box.append(el("strong", "", title), el("p", "", body));
        if (action) {
          const b = el("button", "pill", action.label);
          b.addEventListener("click", action.run);
          box.append(b);
        }
        if (detail) {
          const more = el("details", "detail");
          more.append(el("summary", "", "Show details"), el("code", "", detail));
          box.append(more);
        }
        target.replaceChildren(box);
      }

      function empty() {
        notice(pane, "Find something to play", "Search for a song or an artist. Press / from anywhere to jump back here.");
      }

      function skeleton() {
        const list = el("div", "list");
        for (let i = 0; i < 8; i++) {
          const row = el("div", "track skeleton");
          const who = el("div", "who");
          const a = el("div", "bar");
          a.style.width = `${40 + ((i * 37) % 45)}%`;
          const b = el("div", "bar");
          b.style.width = `${25 + ((i * 23) % 30)}%`;
          who.append(a, b);
          const al = el("div", "album");
          const c = el("div", "bar");
          c.style.width = `${30 + ((i * 41) % 40)}%`;
          al.append(c);
          row.append(el("div", "art-wrap"), who, al, el("div"), el("div"));
          list.append(row);
        }
        pane.replaceChildren(list);
      }

      // ── Results ──────────────────────────────────────────────────────
      function track(r, i) {
        const row = el("div", "track enter");
        row.style.animationDelay = `${Math.min(i, 10) * 24}ms`;
        row.setAttribute("role", "option");

        const wrap = cover(r.cover_url, 120);
        const play = el("div", "play");
        play.append(icon('<path d="M8 5v14l11-7z"/>'));
        wrap.append(play);

        const who = el("div", "who");
        const artist = el("div", "artist");
        if (r.downloaded) {
          const dl = el("span", "dl", "✓");
          dl.title = "Downloaded";
          artist.append(dl);
        }
        artist.append(r.artist || "");
        who.append(el("div", "title", r.title), artist);
        who.title = `${r.title}, ${r.artist}`;
        const album = el("div", "album", albumOf(r));
        album.title = albumOf(r);

        const add = el("button", "add");
        add.type = "button";
        add.setAttribute("aria-label", `Add ${r.title} to the queue`);
        add.title = "Add to queue (Enter)";
        add.append(icon(ICON_PLUS));
        add.addEventListener("click", (e) => {
          e.stopPropagation();
          select(i);
          enqueue(r, add);
        });
        add.addEventListener("dblclick", (e) => e.stopPropagation());

        row.append(wrap, who, album, el("div", "time", duration(r.duration_sec)), add);
        if (now && r.id === now.track.id) row.classList.add("playing");
        row.addEventListener("click", () => select(i));
        row.addEventListener("dblclick", () => playNow(i));
        draggable(row, () => ({ kind: "result", index: i, track: r }));
        return row;
      }

      function render() {
        if (!results.length) {
          notice(pane, "No results", `Nothing matched “${lastQuery}”. Check the spelling, or try fewer words.`);
          return;
        }
        const head = el("div", "head-row");
        head.append(el("span"), el("span", "", "Title"), el("span", "col-album", "Album"), el("span", "", "Length"), el("span"));
        const list = el("div", "list");
        list.setAttribute("role", "listbox");
        list.setAttribute("aria-label", "Songs");
        list.append(el("div", "cursor"), ...results.map(track));
        pane.replaceChildren(el("h2", "", "Songs"), head, list);
        pane.scrollTop = 0;
        moveCursor();
      }

      function moveCursor() {
        const list = pane.querySelector(".list");
        if (!list || !list.querySelector(".cursor")) return;
        const rows = list.querySelectorAll(".track");
        rows.forEach((r, i) => {
          r.classList.toggle("selected", i === selected);
          r.setAttribute("aria-selected", i === selected);
        });
        list.classList.toggle("has-cursor", selected >= 0);
        list.querySelector(".cursor").style.transform = `translateY(${selected * ROW}px)`;
        rows[selected]?.scrollIntoView({ block: "nearest" });
      }

      function select(i) {
        if (!results.length) return;
        selected = Math.max(0, Math.min(results.length - 1, i));
        moveCursor();
      }

      async function run(q) {
        q = q.trim();
        if (!q) {
          seq++;
          results = [];
          selected = -1;
          lastQuery = "";
          field.classList.remove("busy");
          empty();
          return;
        }
        if (q === lastQuery && results.length) return;
        const mine = ++seq;
        // First search, or after an empty or error state: placeholder
        // rows. Refining a list keeps it on screen, with the working line.
        if (!pane.querySelector(".list") || pane.querySelector(".skeleton")) skeleton();
        field.classList.add("busy");
        try {
          const found = await Search(q);
          if (mine !== seq) return;
          results = found || [];
          lastQuery = q;
          failedQuery = "";
          selected = results.length ? 0 : -1;
          render();
        } catch (err) {
          if (mine !== seq) return;
          lastQuery = "";
          results = [];
          const p = problemOf(err);
          const [title, body] = SEARCH_COPY[p.kind] || SEARCH_COPY.other;
          failedQuery = q;
          notice(pane, title, body, { label: "Try again", run: () => run(query.value) }, p.detail);
        } finally {
          if (mine === seq) field.classList.remove("busy");
        }
      }

      // Search as you type, once typing pauses. Enter searches at once,
      // or, on a search already shown, queues the selected song as the
      // TUI's Enter does.
      query.addEventListener("input", () => {
        field.classList.toggle("has-text", query.value.length > 0);
        clearTimeout(debounce);
        debounce = setTimeout(() => run(query.value), 320);
      });
      field.addEventListener("submit", (e) => {
        e.preventDefault();
        clearTimeout(debounce);
        if (results.length && query.value.trim() === lastQuery) {
          enqueue(results[selected]);
          return;
        }
        run(query.value);
      });
      $("clear").addEventListener("click", () => {
        query.value = "";
        field.classList.remove("has-text");
        run("");
        query.focus();
      });

      // ── Layout: resizable sidebar and side panel ─────────────────────
      // Widths are remembered between runs. Storage can be missing or
      // refuse writes, so every access is guarded and the defaults stand
      // in for anything it cannot give back.
      const app = $("app");
      const SIDE = { def: 240, min: 200, max: 400, collapsed: 76, snap: 150 };
      const RIGHT = { def: 320, min: 260, max: 520 };
      const MAIN_MIN = 380;
      const GUTTERS = 8 * 2 + 8 * 2; // the app's padding and both splitters
      const layout = { side: SIDE.def, right: RIGHT.def, rightOpen: true, tab: "queue" };
      try {
        Object.assign(layout, JSON.parse(localStorage.getItem("ytmgo:layout") || "{}"));
      } catch {}
      const save = () => {
        try {
          localStorage.setItem("ytmgo:layout", JSON.stringify(layout));
        } catch {}
      };

      // The sidebar either collapses to icons or sits between min and
      // max; the main view never gets squeezed below MAIN_MIN.
      function apply() {
        const room = app.clientWidth - GUTTERS - MAIN_MIN;
        let right = layout.rightOpen ? Math.min(Math.max(layout.right, RIGHT.min), RIGHT.max) : 0;
        let side = layout.side < SIDE.snap ? SIDE.collapsed : Math.min(Math.max(layout.side, SIDE.min), SIDE.max);
        if (side + right > room) side = SIDE.collapsed;
        if (side + right > room) right = Math.max(RIGHT.min, room - side);
        // No room for the panel even at its narrowest: hide it for now,
        // without forgetting it was open.
        const squeezed = layout.rightOpen && side + right > room;
        app.style.setProperty("--side-w", `${side}px`);
        app.style.setProperty("--right-w", `${right}px`);
        app.classList.toggle("side-collapsed", side === SIDE.collapsed);
        app.classList.toggle("right-closed", !layout.rightOpen || squeezed);
        for (const t of document.querySelectorAll(".tab")) t.setAttribute("aria-selected", t.dataset.tab === layout.tab);
        for (const b of document.querySelectorAll("[data-open]"))
          b.setAttribute("aria-pressed", layout.rightOpen && b.dataset.open === layout.tab);
        renderPanel();
      }

      function dragSplitter(splitter, onMove) {
        splitter.addEventListener("pointerdown", (e) => {
          e.preventDefault();
          splitter.setPointerCapture(e.pointerId);
          app.classList.add("dragging");
          splitter.classList.add("active");
          const box = app.getBoundingClientRect();
          const move = (ev) => {
            onMove(ev.clientX, box);
            apply();
          };
          const up = () => {
            app.classList.remove("dragging");
            splitter.classList.remove("active");
            splitter.removeEventListener("pointermove", move);
            save();
          };
          splitter.addEventListener("pointermove", move);
          splitter.addEventListener("pointerup", up, { once: true });
          splitter.addEventListener("pointercancel", up, { once: true });
        });
      }
      const left = document.querySelector(".split-left");
      const rightSplit = document.querySelector(".split-right");
      dragSplitter(left, (x, box) => (layout.side = x - box.left - 8));
      dragSplitter(rightSplit, (x, box) => (layout.right = box.right - x - 8));

      // Double-click puts a panel back to its default width; arrow keys
      // resize from the keyboard, Enter folds or unfolds the sidebar.
      left.addEventListener("dblclick", () => {
        layout.side = SIDE.def;
        apply();
        save();
      });
      rightSplit.addEventListener("dblclick", () => {
        layout.right = RIGHT.def;
        apply();
        save();
      });
      function keyResize(e, key, step) {
        if (e.key !== "ArrowLeft" && e.key !== "ArrowRight" && e.key !== "Enter") return;
        e.preventDefault();
        e.stopPropagation();
        if (e.key === "Enter" && key === "side") {
          layout.side = layout.side < SIDE.snap ? SIDE.def : SIDE.collapsed;
        } else if (e.key !== "Enter") {
          const grow = e.key === "ArrowRight" ? 1 : -1;
          if (key === "side" && layout.side < SIDE.snap) layout.side = grow > 0 ? SIDE.min : SIDE.collapsed;
          else layout[key] += grow * step;
        }
        apply();
        save();
      }
      left.addEventListener("keydown", (e) => keyResize(e, "side", 16));
      rightSplit.addEventListener("keydown", (e) => keyResize(e, "right", -16));

      // The panel opens on the tab its button names; that tab's button
      // again closes it. show opens it without toggling.
      function openPanel(tab, show = false) {
        layout.rightOpen = show || !(layout.rightOpen && layout.tab === tab);
        layout.tab = tab;
        apply();
        save();
      }
      for (const b of document.querySelectorAll("[data-open]")) b.addEventListener("click", () => openPanel(b.dataset.open));
      for (const t of document.querySelectorAll(".tab"))
        t.addEventListener("click", () => {
          layout.tab = t.dataset.tab;
          apply();
          save();
        });
      $("close-panel").addEventListener("click", () => {
        layout.rightOpen = false;
        apply();
        save();
      });

      function renderPanel() {
        if (layout.tab === "queue") renderQueue();
        else notice($("panel-body"), "Nothing playing", "Lyrics follow along here while a song plays.");
      }

      // ── Queue ────────────────────────────────────────────────────────
      // Go owns the queue (internal/gui/queue.go). Every change answers
      // with the whole of it; the page draws that and plays its current
      // track, and keeps no list of its own.
      let qs = { tracks: [], current: -1, shuffle: false, repeat: "off", next: null };
      let landed = -1; // a row to flash once drawn: just dropped or added
      let clearArmed = false;
      const current = () => (qs.current >= 0 ? qs.tracks[qs.current] : null);

      function setQueue(s) {
        const moved = s.current !== qs.current;
        qs = s;
        renderQueue(moved);
        modes();
        markPlaying();
        $("next").title = qs.next ? `Next: ${qs.next.title} (n)` : "Next (n)";
      }

      function renderQueue(follow = false) {
        const body = $("panel-body");
        if (layout.tab !== "queue") return;
        if (!qs.tracks.length) {
          notice(body, "Your queue is empty", "Songs you play or add show up here, with what comes next. Drag a song here to queue it.");
          return;
        }
        const keep = body.scrollTop;
        const secs = qs.tracks.reduce((n, t) => n + (t.duration_sec || 0), 0);
        const head = el("div", "q-summary");
        const count = `${qs.tracks.length} ${qs.tracks.length === 1 ? "song" : "songs"}`;
        head.append(el("span", "", secs ? `${count} · ${total(secs)}` : count));
        const clear = el("button", "q-clear" + (clearArmed ? " confirm" : ""), clearArmed ? "Clear all?" : "Clear");
        clear.type = "button";
        clear.title = clearArmed ? "Click again to clear the queue" : "Clear the queue";
        clear.addEventListener("click", clearQueue);
        head.append(clear);

        const list = el("ol", "q-list");
        list.setAttribute("aria-label", "Queue");
        qs.tracks.forEach((t, i) => list.append(queueRow(t, i)));
        body.replaceChildren(head, list);
        body.scrollTop = keep;
        const cur = list.children[qs.current];
        if (follow && cur) cur.scrollIntoView({ block: "nearest" });
        if (landed >= 0) {
          list.children[landed]?.classList.add("landed");
          list.children[landed]?.scrollIntoView({ block: "nearest" });
          landed = -1;
        }
      }

      function queueRow(t, i) {
        const row = el("li", "q-row" + (i === qs.current ? " current" : ""));
        row.tabIndex = 0;
        row.dataset.index = i;
        row.title = albumOf(t) ? `${t.title}, ${t.artist}, from ${albumOf(t)}` : `${t.title}, ${t.artist}`;
        const num = el("span", "q-num", i === qs.current ? "▶" : String(i + 1));
        const who = el("div", "q-who");
        const artist = el("div", "q-artist");
        if (t.downloaded) {
          const dl = el("span", "dl", "✓");
          dl.title = "Downloaded";
          artist.append(dl);
        }
        artist.append(t.artist || "");
        who.append(el("div", "q-title", t.title), artist);
        row.append(num, cover(t.cover_url, 120), who, el("span", "q-time", t.duration || duration(t.duration_sec)));
        // The playing song is not removable: the TUI lets it be removed
        // and then keeps playing it while the marker moves on.
        if (i !== qs.current) {
          const rm = el("button", "q-remove");
          rm.type = "button";
          rm.setAttribute("aria-label", `Remove ${t.title} from the queue`);
          rm.title = "Remove (Delete)";
          rm.append(icon(ICON_X));
          rm.addEventListener("click", async (e) => {
            e.stopPropagation();
            setQueue(await Remove(i));
          });
          rm.addEventListener("dblclick", (e) => e.stopPropagation());
          row.append(rm);
        } else row.append(el("span"));
        row.addEventListener("dblclick", () => jump(i));
        // The keys the TUI's queue pane has: Enter plays, d or Delete
        // removes, ctrl+↑/↓ reorders; ↑/↓ move between rows.
        row.addEventListener("keydown", async (e) => {
          const n = qs.tracks.length;
          if (e.key === "Enter") {
            e.preventDefault();
            e.stopPropagation();
            jump(i);
          } else if ((e.key === "Delete" || e.key === "d") && i !== qs.current) {
            e.preventDefault();
            e.stopPropagation();
            setQueue(await Remove(i));
            focusRow(Math.min(i, qs.tracks.length - 1));
          } else if ((e.key === "ArrowUp" || e.key === "ArrowDown") && e.ctrlKey) {
            e.preventDefault();
            e.stopPropagation();
            const to = i + (e.key === "ArrowUp" ? -1 : 1);
            if (to < 0 || to >= n) return;
            setQueue(await Move(i, to));
            focusRow(to);
          } else if (e.key === "ArrowUp" || e.key === "ArrowDown" || e.key === "j" || e.key === "k") {
            e.preventDefault();
            e.stopPropagation();
            focusRow(i + (e.key === "ArrowUp" || e.key === "k" ? -1 : 1));
          }
        });
        draggable(row, () => ({ kind: "queue", index: i, track: t }));
        return row;
      }
      function focusRow(i) {
        $("panel-body").querySelector(`.q-row[data-index="${Math.max(0, i)}"]`)?.focus();
      }

      async function jump(i) {
        setQueue(await Jump(i));
        start();
      }

      // Clearing asks first, as the TUI's D does, but in place: the
      // button turns into the question for a few seconds.
      let clearTimer;
      async function clearQueue() {
        if (!clearArmed) {
          clearArmed = true;
          renderQueue();
          clearTimer = setTimeout(() => {
            clearArmed = false;
            renderQueue();
          }, 3500);
          return;
        }
        clearTimeout(clearTimer);
        clearArmed = false;
        stop();
        now = null;
        idle();
        setQueue(await Clear());
      }

      // The TUI's Enter: to the end of the queue, and playing if nothing
      // is. button, if given, turns into a tick for a moment.
      async function enqueue(t, button) {
        if (!t) return;
        let s = await Add(t);
        if (playState === "stopped") {
          s = await Jump(s.tracks.length - 1);
          setQueue(s);
          start();
        } else {
          landed = s.tracks.length - 1;
          setQueue(s);
        }
        tick(button || pane.querySelectorAll(".list .track")[results.indexOf(t)]?.querySelector(".add"));
      }
      function tick(button) {
        if (!button) return;
        button.classList.add("done");
        button.replaceChildren(icon(ICON_CHECK));
        setTimeout(() => {
          button.classList.remove("done");
          button.replaceChildren(icon(ICON_PLUS));
        }, 1200);
      }

      // Double-click: now, straight after the song playing.
      async function playNow(i) {
        select(i);
        setQueue(await PlayNow(results[i]));
        start();
      }

      // The TUI's e: every song listed, and the first of them playing if
      // nothing is.
      async function queueAll() {
        if (!results.length) return;
        let s = await AddAll(results);
        const first = s.tracks.length - results.length;
        if (playState === "stopped") {
          s = await Jump(first);
          setQueue(s);
          start();
        } else {
          landed = first;
          setQueue(s);
        }
      }

      // ── Drag and drop ────────────────────────────────────────────────
      // Songs drag from the results, or from the queue itself, onto the
      // queue. Pointer events rather than the browser's own drag and
      // drop: it draws the card and the drop line as wanted, behaves the
      // same in every WebView, and stays clear of Wails' file drop.
      const ghost = $("ghost");
      const DRAG_FROM = 6; // px before a press becomes a drag, so clicks stay clicks
      let drag = null;

      function draggable(node, what) {
        node.addEventListener("pointerdown", (e) => {
          if (e.button !== 0 || e.target.closest("button")) return;
          drag = { ...what(), node, x: e.clientX, y: e.clientY, active: false, at: null };
        });
      }

      document.addEventListener("pointermove", (e) => {
        if (!drag) return;
        if (!drag.active) {
          if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < DRAG_FROM) return;
          beginDrag();
        }
        drag.px = e.clientX;
        drag.py = e.clientY;
        ghost.style.transform = `translate(${e.clientX + 14}px, ${e.clientY + 12}px)`;
        locateDrop();
      });
      document.addEventListener("pointerup", () => {
        if (drag?.active) endDrag(true);
        drag = null;
      });
      window.addEventListener("blur", () => drag?.active && endDrag(false));

      function beginDrag() {
        drag.active = true;
        document.body.classList.add("drag-song");
        drag.node.classList.add("dragged-from");
        const text = el("div", "g-text");
        text.append(el("div", "g-title", drag.track.title), el("div", "g-sub", drag.track.artist || ""));
        ghost.replaceChildren(cover(drag.track.cover_url, 120), text);
        ghost.classList.add("show");
        // A song dragged from the results needs somewhere to land.
        if (drag.kind === "result" && (!layout.rightOpen || layout.tab !== "queue")) openPanel("queue", true);
        scrollLoop();
      }

      // Where the song would land: before the first row whose middle is
      // below the pointer, or at the end. Moving a queue row onto its own
      // place changes nothing, so no line is drawn there.
      function locateDrop() {
        const body = $("panel-body");
        const box = body.getBoundingClientRect();
        const inside = drag.px >= box.left && drag.px <= box.right && drag.py >= box.top && drag.py <= box.bottom;
        body.classList.toggle("drop-target", inside);
        let line = body.querySelector(".drop-line");
        if (!inside) {
          drag.at = null;
          line?.remove();
          return;
        }
        const rows = [...body.querySelectorAll(".q-row")];
        let at = rows.findIndex((r) => {
          const b = r.getBoundingClientRect();
          return drag.py < b.top + b.height / 2;
        });
        if (at < 0) at = rows.length;
        drag.at = at;
        const list = body.querySelector(".q-list");
        const noop = drag.kind === "queue" && (at === drag.index || at === drag.index + 1);
        if (!list || noop) {
          line?.remove();
          return;
        }
        if (!line) {
          line = el("div", "drop-line");
          list.append(line);
        }
        line.style.top = `${at < rows.length ? rows[at].offsetTop : rows[rows.length - 1].offsetTop + rows[rows.length - 1].offsetHeight}px`;
      }

      // Near the top or bottom edge of the queue, it scrolls, faster the
      // closer the pointer is, so a song can be dropped anywhere in a
      // long queue.
      function scrollLoop() {
        if (!drag?.active) return;
        const body = $("panel-body");
        const box = body.getBoundingClientRect();
        const EDGE = 48;
        let speed = 0;
        if (drag.px >= box.left && drag.px <= box.right) {
          if (drag.py < box.top + EDGE) speed = -Math.ceil((box.top + EDGE - drag.py) / 4);
          else if (drag.py > box.bottom - EDGE) speed = Math.ceil((drag.py - (box.bottom - EDGE)) / 4);
        }
        if (speed) {
          body.scrollTop += speed;
          locateDrop();
        }
        requestAnimationFrame(scrollLoop);
      }

      async function endDrag(commit) {
        const d = drag;
        drag = null;
        document.body.classList.remove("drag-song");
        d.node.classList.remove("dragged-from");
        ghost.classList.remove("show");
        const body = $("panel-body");
        body.classList.remove("drop-target");
        body.querySelector(".drop-line")?.remove();
        if (!commit || d.at == null) return;
        if (d.kind === "queue") {
          const to = d.at > d.index ? d.at - 1 : d.at;
          if (to === d.index) return;
          landed = to;
          setQueue(await Move(d.index, to));
        } else {
          const s = await Insert(d.track, d.at);
          landed = s.tracks.findIndex((t) => t.id === d.track.id);
          setQueue(s);
        }
      }

      // ── Player ───────────────────────────────────────────────────────
      // Plays the queue's current track. The audio is a direct stream
      // yt-dlp resolves when a track starts; streams expire, so none is
      // kept.
      const audio = $("audio");
      const toggle = $("toggle");
      const seek = $("seek");
      const seekFill = $("seek-fill");
      let now = null; // { track, retried }
      // stopped, playing or paused, as the TUI's player state: Enter
      // starts a song only when stopped, not when paused.
      let playState = "stopped";
      let playSeq = 0;
      let seeking = false;

      function markPlaying() {
        const rows = pane.querySelectorAll(".list .track");
        rows.forEach((row, i) => row.classList.toggle("playing", !!now && results[i]?.id === now.track.id));
      }

      function modes() {
        $("shuffle").setAttribute("aria-pressed", qs.shuffle);
        const rep = $("repeat");
        rep.setAttribute("aria-pressed", qs.repeat !== "off");
        rep.classList.toggle("one", qs.repeat === "one");
        rep.setAttribute("aria-label", `Repeat: ${qs.repeat}`);
        rep.title = { off: "Repeat: off (r)", one: "Repeat this song (r)", all: "Repeat the queue (r)" }[qs.repeat];
      }

      function showTrack(t) {
        const art = $("np-art");
        const wrap = art.parentElement;
        art.classList.remove("loaded");
        wrap.classList.toggle("missing", !t.cover_url);
        art.onload = () => art.classList.add("loaded");
        art.onerror = () => {
          wrap.classList.add("missing");
          art.removeAttribute("src");
        };
        if (t.cover_url) art.src = sized(t.cover_url, 120);
        else art.removeAttribute("src");
        const text = $("np-text");
        $("np-title").textContent = t.title;
        $("np-sub").textContent = t.artist;
        text.title = albumOf(t) ? `${t.title}, ${t.artist}, from ${albumOf(t)}` : `${t.title}, ${t.artist}`;
        text.classList.remove("change");
        void text.offsetWidth; // restart the entrance for each new track
        text.classList.add("change");
        $("t-end").textContent = duration(t.duration_sec) || "0:00";
        for (const id of ["prev", "toggle", "next"]) $(id).disabled = false;
        if ("mediaSession" in navigator) {
          navigator.mediaSession.metadata = new MediaMetadata({
            title: t.title,
            artist: t.artist,
            album: albumOf(t),
            artwork: t.cover_url ? [{ src: sized(t.cover_url, 512), sizes: "512x512", type: "image/jpeg" }] : [],
          });
        }
      }

      // Back to "Nothing playing yet", as after clearing the queue.
      function idle() {
        $("np-title").textContent = "";
        $("np-sub").textContent = "Nothing playing yet";
        $("np-text").removeAttribute("title");
        $("np-art").removeAttribute("src");
        $("np-art").parentElement.classList.remove("missing");
        $("t-now").textContent = "0:00";
        $("t-end").textContent = "0:00";
        seekFill.style.width = "0";
        for (const id of ["prev", "toggle", "next"]) $(id).disabled = true;
        markPlaying();
      }

      function stop() {
        playState = "stopped";
        playSeq++;
        audio.pause();
        audio.removeAttribute("src");
        setLoading(false);
      }

      // Songs that failed in a row. Skipping on is right for one song
      // that will not play; three in a row means something bigger is
      // wrong, and skipping on would run through the whole list.
      let failures = 0;

      function setLoading(on) {
        toggle.classList.toggle("loading", on);
        seek.classList.toggle("loading", on);
      }

      // Plays whatever the queue says is current, from at seconds.
      async function start(at = 0) {
        const track = current();
        if (!track) return;
        const fresh = !now || now.track.id !== track.id;
        // retried stays with the song across restarts of it, so a stream
        // that keeps failing is given up on rather than retried forever.
        now = { track, retried: fresh ? false : now.retried };
        const mine = ++playSeq;
        audio.pause();
        playState = "playing";
        if (fresh) {
          showTrack(track);
          markPlaying();
          updateSeek(0);
        }
        setLoading(true);
        let url;
        try {
          url = await StreamURL(track.url);
        } catch (err) {
          if (mine !== playSeq) return;
          setLoading(false);
          cannotPlay(track, problemOf(err));
          return;
        }
        if (mine !== playSeq) return;
        audio.src = url;
        if (at) audio.currentTime = at;
        // A stream that will not play says so through the error event,
        // which handles it once; play()'s own rejection is that same
        // failure, so it is not handled again here.
        audio.play().catch(() => {});
      }

      // What to do when a song cannot start, by why.
      async function cannotPlay(track, p) {
        audio.removeAttribute("src");
        console.error(p.detail);
        if (p.kind === "unavailable" || p.kind === "other") {
          if (++failures >= 3) {
            failures = 0;
            playState = "stopped";
            say("Stopped after 3 songs failed", { error: true, sticky: true, full: "Stopped: three songs in a row couldn’t play." });
            return;
          }
          say(`Skipped “${track.title}”, unavailable`, { full: `Skipped “${track.title}”: it can’t be played here.` });
          const s = await Skip();
          setQueue(s);
          if (s.moved) start();
          else playState = "stopped";
          return;
        }
        playState = "stopped";
        const [why, full] = {
          offline: ["Offline. Press play to retry", "You’re offline. Press play once you’re back online."],
          timeout: ["Timed out. Press play to retry", "YouTube took too long to answer. Press play to try again."],
          "missing-tool": ["yt-dlp isn’t installed", "yt-dlp isn’t installed, so nothing can play."],
        }[p.kind];
        say(why, { error: true, sticky: true, full });
      }

      // Next and previous as the TUI's n and p: next moves on even under
      // repeat-one; previous restarts a song more than 3s in.
      async function next() {
        if (!qs.tracks.length) return;
        const s = await Skip();
        setQueue(s);
        if (s.moved) start();
        else say("End of the queue", { full: "That was the last song in the queue." });
      }
      async function prev() {
        if (now && audio.currentTime > 3) {
          audio.currentTime = 0;
          return;
        }
        if (!qs.tracks.length) return;
        setQueue(await Back());
        start();
      }
      // A song that finished by itself: repeat-one plays it again, the
      // end of the queue stops.
      async function ended() {
        const before = qs.current;
        const s = await Ended();
        setQueue(s);
        if (!s.moved) {
          playState = "stopped";
          say("End of the queue", { full: "That was the last song in the queue." });
          return;
        }
        if (s.current === before && s.repeat === "one") {
          audio.currentTime = 0;
          audio.play().catch(() => {});
          return;
        }
        start();
      }

      async function togglePlay() {
        if (!now) {
          if (qs.current >= 0) start();
          else if (qs.tracks.length) {
            setQueue(await Jump(0));
            start();
          } else if (results.length) playNow(Math.max(selected, 0));
          return;
        }
        // A song that never started, or lost its stream: start it again,
        // from where it stopped.
        if (!audio.getAttribute("src")) {
          start(audio.currentTime || 0);
          return;
        }
        if (audio.paused) audio.play().catch(() => {});
        else audio.pause();
      }
      function seekBy(secs) {
        if (!now || !isFinite(audio.duration)) return;
        audio.currentTime = Math.min(Math.max(audio.currentTime + secs, 0), audio.duration);
      }

      $("prev").addEventListener("click", prev);
      $("next").addEventListener("click", next);
      toggle.addEventListener("click", togglePlay);
      $("shuffle").addEventListener("click", async () => setQueue(await ToggleShuffle()));
      $("repeat").addEventListener("click", async () => setQueue(await CycleRepeat()));

      audio.addEventListener("playing", () => {
        failures = 0;
        playState = "playing";
        if (sayingSticky) unsay();
        setLoading(false);
        toggle.classList.add("playing");
        toggle.setAttribute("aria-label", "Pause");
      });
      audio.addEventListener("pause", () => {
        if (playState === "playing" && audio.getAttribute("src") && !audio.ended) playState = "paused";
        toggle.classList.remove("playing");
        toggle.setAttribute("aria-label", "Play");
      });
      audio.addEventListener("waiting", () => setLoading(true));
      audio.addEventListener("canplay", () => setLoading(false));
      audio.addEventListener("loadedmetadata", () => {
        if (isFinite(audio.duration)) $("t-end").textContent = duration(Math.round(audio.duration));
      });
      audio.addEventListener("timeupdate", () => {
        if (!seeking && isFinite(audio.duration) && audio.duration > 0) updateSeek(audio.currentTime / audio.duration);
      });
      audio.addEventListener("ended", ended);
      // A stream that breaks mid-song has usually expired (they last
      // some hours) or lost the network. Offline, wait for it to come
      // back; otherwise fetch a new stream once and carry on from the
      // same point.
      let resumeAt = null;
      audio.addEventListener("error", () => {
        if (!audio.getAttribute("src") || !now) return;
        const at = audio.currentTime || 0;
        setLoading(false);
        audio.removeAttribute("src");
        if (!navigator.onLine) {
          resumeAt = at;
          playState = "stopped";
          say("Connection lost, resumes online", { error: true, sticky: true, full: "Lost the connection. The song picks up again when you’re back online." });
          return;
        }
        if (now.retried) {
          now.retried = false;
          cannotPlay(now.track, { kind: "other", detail: "the stream failed twice" });
          return;
        }
        now.retried = true;
        start(at);
      });

      function updateSeek(ratio) {
        seekFill.style.width = `${ratio * 100}%`;
        const length = isFinite(audio.duration) ? audio.duration : now?.track.duration_sec || 0;
        $("t-now").textContent = duration(Math.floor(ratio * length)) || "0:00";
        seek.setAttribute("aria-valuemax", Math.round(length));
        seek.setAttribute("aria-valuenow", Math.round(ratio * length));
      }

      // Click or drag anywhere on the bar; the song jumps on release.
      seek.addEventListener("pointerdown", (e) => {
        if (!now || !isFinite(audio.duration)) return;
        seeking = true;
        seek.classList.add("dragging");
        seek.setPointerCapture(e.pointerId);
